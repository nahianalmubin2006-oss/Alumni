name: Admin RBAC CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/admin-rbac-integrated-main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run security regression tests
        run: npm run test:security
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
