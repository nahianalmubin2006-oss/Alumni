name: AI university data research

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Zero-based starting index in ALL_DIRECTORY_UNIVERSITIES"
        required: true
        default: "0"
        type: string
      batch_size:
        description: "Universities to research in this run (1–30)"
        required: true
        default: "10"
        type: string
  schedule:
    # A small weekly batch to control API usage. Run manual batches to cover the full directory.
    - cron: "45 3 * * 1"

permissions:
  contents: write

concurrency:
  group: ai-university-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/real-university-logos
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run AI research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNIVERSITY_OFFSET: ${{ github.event.inputs.start_index || '0' }}
          UNIVERSITY_BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
        run: npx tsx scripts/ai_collect_university_data.ts
      - name: Upload research results for review
        uses: actions/upload-artifact@v4
        with:
          name: ai-university-research-${{ github.run_number }}
          path: src/data/research-candidates/university-data-candidates.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit research candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/research-candidates/university-data-candidates.json
          if git diff --cached --quiet; then
            echo "No candidate data changes."
            exit 0
          fi
          git commit -m "chore: refresh AI university research candidates"
          git push origin HEAD:automation/real-university-logos
