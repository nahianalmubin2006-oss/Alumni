name: Collect real university logo candidates

on:
  push:
    branches:
      - automation/real-university-logos
    paths:
      - 'scripts/download_real_university_logos.ts'
      - '.github/workflows/collect-university-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-university-logo-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Collect logo candidates
        run: npx tsx scripts/download_real_university_logos.ts
      - name: Commit collected candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logos/official-candidates src/data/official-logo-manifest.json
          if git diff --cached --quiet; then
            echo "No logo candidate changes to commit."
          else
            git commit -m "Collect official university logo candidates"
            git push
          fi
